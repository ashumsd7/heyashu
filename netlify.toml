[build]
  command = "npm run build"
  publish = "out"

[build.environment]
  NODE_VERSION = "20"
  NETLIFY = "true"
NETLIFY_NEXT_PLUGIN_SKIP = "true"

[[headers]]
  for = "/pvt*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow, noarchive, nosnippet, noimageindex"
    Cache-Control = "no-store, no-cache, must-revalidate, proxy-revalidate"

