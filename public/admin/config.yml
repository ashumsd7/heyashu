      - label: "Episode Thumbnail Image"
        name: "thumbnail"
        widget: "image"
        required: false
        choose_url: false
        hint: "Uploads to public/images/namaste-ai/ (served as /images/namaste-ai/). Do not use ImgBB or external URLs."
      - { label: "Author", name: "author", widget: "string", default: "Ashutosh Anand Tiwari" }
      - { label: "Tags", name: "tags", required: false, default: "namaste-ai-notes", widget: "string", hint: "Add tags comma separated e.g.: AI, Machine Learning, that can be used for SEO or categorization." }
      - label: "Your profile picture"
        name: "profilePic"
        widget: "image"
        required: false
        choose_url: false
        default: "/images/blogs/pfp2.png"
        hint: "Upload your avatar — saved to public/images/namaste-ai/."
      - { label: "Social Link (When user clicks on follow button: we will contact you once your content will be live after saving)", name: "followLink", widget: "string", default: "https://www.instagram.com/javascripterrr", required: false }
      - { label: "Resource Video Link", name: "resourceVideoLink", widget: "string", required: false, hint: "Add a YouTube or other video link associated with this note (optional)" }
      - label: "Describe your content here"
        name: "body"
        widget: "markdown"
        editor_components: ["image", "code-block"]
        hint: "For images: click + → Image → Choose an image. Saved to /images/namaste-ai/. Do NOT paste ImgBB/external URLs."
