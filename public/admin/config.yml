    description: Get the best-explained notes for each chapter of the Namaste AI course by Akshay Saini. These notes are contributed by the open source community.✨
    folder: "/src/content/namaste-ai-notes"
    # Collection media_folder is relative to `folder` — climb to repo root public/
    media_folder: "../../../public/images/namaste-ai"
    public_folder: /images/namaste-ai
    create: true
    slug: ""
    delete: false
    fields:
      - { label: "Slug of the page", name: "title", widget: "string", hint: "This will be used as slug, Instructions: After filling out this form and adding your markdown, click the 'Save' button at the top. This action will create a Pull Request (PR) on GitHub. Within a few minutes, your PR will be merged, and your content will go live at https://heyashu.in/digital-garden/notes/namaste-ai-notes/your-slug. To track the PR status, visit https://github.com/ashumsd7/heyashu/pulls. Thank you!" }
      - { label: "Note Title", name: "name", widget: "string", hint: "This is the heading for your note, shown at the top of the page." }
      - { label: "Episode Number", name: "episode", widget: "number", hint: "Episode number" }
