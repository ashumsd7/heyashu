backend:
  name: git-gateway
  branch: main # Branch to update (optional; defaults to master)
publish_mode: editorial_workflow
site_url: https://heyashu.in
logo_url: https://avatars.githubusercontent.com/u/40313523?v=4

media_folder: public/images/blogs
public_folder: /images/blogs
collections:
  - name: "blog"
    label: "Blog"
    description: 🌱 Feel free to contribute! Write a new blog or edit an existing one if you spot any errors. As soon as you submit your changes, a pull request will be created. Once it's merged, your update will go live on heyashu.in/blog/your-blog-title within minutes! 🚀 Let's grow this digital garden together! 🌿✨
    folder: "/src/content/blog"
    create: true
    slug: ""
    delete: false
    editor:
      preview: false
    fields:
      - { label: "Slug", name: "title", widget: "string", hint: 'This will be used as slug Instructions: After filling out this form and adding your markdown, click the "Save" button at the top. This action will create a Pull Request (PR) on GitHub. Within a few minutes, your PR will be merged, and your blog will go live at https://heyashu.in/blog/your-blog-slug. To track the PR status, visit this repo link https://github.com/ashumsd7/heyashu/pulls. Look for a PR with your name and blog title. Then, just wait a few minutes. Thank you!' }
      - { label: "Blog Title", name: "name", widget: "string", hint: "This is the heading on your blog , will be rendered on top of the webpage and then thumbnail" }
      - { label: "Publish Date", name: "date", widget: "datetime", time_format: false, date_format: "MM-DD-YYYY", format: "MM-DD-YYYY" }
      - { label: "Update  Date", name: "updateDate", widget: "datetime", time_format: false, date_format: "MM-DD-YYYY", format: "MM-DD-YYYY" }
      - { label: "Blog Thumbnail Image", required: false, name: "thumbnail", widget: "image", hint: "This will appear on the top of the blog after title." }
      - { label: "Author", name: "author", required: false, widget: "string", default: "Ashutosh Anand Tiwari" }
      - { label: "Tags", name: "tags", widget: "string", required: false, default: "blog", hint: "Add tags comma separated example : JavaScript, Web, Web Development, that can be used seo purpose also in the ui for category." }
      - { label: "Your profile picture", name: "profilePic", widget: "image", required: false, default: "https://i.ibb.co/v71k25N/pfpppp.png", hint: "This image will be shown in the profile picture  avatar." }
      - { label: "Social Link( When user clicks on follow button : we will contact you once your content will be live in next  few minutes after saving it)", name: "followLink", widget: "string", required: false, default: "https://www.instagram.com/javascripterrr" }
      - { label: "Describe your content here", name: "body", hint: "Here also you can beautify your content below H denotes Heading and click on + icon to add images and you can use any of the option in below control bar.", widget: "markdown" }
  - name: "daily-updates"
    label: "Daily Update: Stand Up"
    description: 🌱 Consistency is key to success. Stay committed, update your progress, and make a meaningful impact. Together, we'll achieve success! 🌿✨
    folder: "/src/content/daily-updates"
    create: true
    slug: ""
    delete: false
    editor:
      preview: false
    fields:
      - { label: "Slug", name: "title", widget: "string", hint: 'This will be used as slug Instructions: After filling out this form and adding your markdown, click the "Save" button at the top. This action will create a Pull Request (PR) on GitHub. Within a few minutes, your PR will be merged, and your blog will go live at https://heyashu.in/blog/your-blog-slug. To track the PR status, visit this repo link https://github.com/ashumsd7/heyashu/pulls. Look for a PR with your name and blog title. Then, just wait a few minutes. Thank you!' }
      - { label: "Your Page Title", name: "name", widget: "string", hint: "This is the heading on your page , will be shown  on top of the page and then image" }
      - { label: "Publish Date", name: "date", widget: "datetime", time_format: false, date_format: "MM-DD-YYYY", format: "MM-DD-YYYY" }
      - { label: "Update  Date", name: "updateDate", widget: "datetime", time_format: false, date_format: "MM-DD-YYYY", format: "MM-DD-YYYY" }
      - { label: "Blog Thumbnail Image", required: false, name: "thumbnail", widget: "image", hint: "This will appear on the top of the blog after title." }
      - { label: "Author ( Your Name)", name: "author", required: false, widget: "string", default: "Ashutosh Anand Tiwari" }
      - { label: "Tags", name: "tags", required: false, widget: "string", default: "daily-updates", hint: "Add tags comma separated example : JavaScript, Web, Web Development, that can be used seo purpose also in the ui for category." }
      - { label: "Your profile picture", name: "profilePic", widget: "image", required: false, default: "https://i.ibb.co/v71k25N/pfpppp.png", hint: "This image will be shown in the profile picture  avatar." }
      - { label: "Social Link( When user clicks on follow button : we will contact you once your content will be live in next  few minutes after saving it)", name: "followLink", widget: "string", required: false, default: "https://www.instagram.com/javascripterrr" }
      - { label: "Write / Update whatever you want to", name: "body", hint: "Here also you can beautify your content below H denotes Heading and click on + icon to add images and you can use any of the option in below control bar.", widget: "markdown" }
